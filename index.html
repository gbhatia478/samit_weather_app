<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samit Roast — Weather-Powered Roasting</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100svh;
      background:
        radial-gradient(circle at 80% -10%, rgba(240, 106, 78, 0.16), transparent 38%),
        radial-gradient(circle at -10% 20%, rgba(255, 255, 255, 0.06), transparent 34%),
        #0a0b0d;
      color: #f3f3ee;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .container {
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    h1 {
      color: #f3f3ee;
      font-size: 3.2rem;
      font-weight: 600;
      letter-spacing: -0.07em;
      line-height: 0.95;
      margin-bottom: 12px;
    }

    .eyebrow {
      color: #f06a4e;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #8f938e;
      font-size: 1rem;
      letter-spacing: -0.01em;
      margin: 0 auto 26px;
      max-width: 290px;
    }

    .location-search {
      display: flex;
      gap: 8px;
      margin: 0 auto 4px;
      max-width: 420px;
    }

    .sr-only {
      height: 1px;
      margin: -1px;
      overflow: hidden;
      position: absolute;
      width: 1px;
      clip: rect(0, 0, 0, 0);
    }

    .location-input {
      background: #17191d;
      border: 1px solid #2b2e33;
      border-radius: 999px;
      color: #f3f3ee;
      font: inherit;
      min-width: 0;
      padding: 13px 16px;
      width: 100%;
    }

    .location-input::placeholder {
      color: #777b76;
    }

    .location-input:focus {
      border-color: #f06a4e;
      outline: 2px solid rgba(240, 106, 78, 0.18);
    }

    .search-btn,
    .use-location {
      border: 0;
      cursor: pointer;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .search-btn {
      background: #f06a4e;
      border-radius: 999px;
      color: #150f0c;
      padding: 0 17px;
    }

    .use-location {
      background: transparent;
      color: #9ca09a;
      padding: 5px 10px;
    }

    .use-location:hover,
    .use-location:focus {
      color: #f3f3ee;
    }

    .weather-card {
      background: #17191d;
      border: 1px solid #2b2e33;
      border-radius: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      margin-bottom: 14px;
      padding: 26px;
      text-align: left;
    }

    .location {
      color: #bfc2bc;
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
    }

    .temperature {
      color: #f3f3ee;
      font-size: 5.5rem;
      font-weight: 500;
      letter-spacing: -0.09em;
      line-height: 0.9;
      margin: 26px 0 16px;
    }

    .condition {
      color: #aeb2ac;
      font-size: 1.2rem;
      font-weight: 500;
      text-transform: capitalize;
      margin-bottom: 0;
    }

    .details {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .detail-item {
      background: #23262b;
      border-radius: 999px;
      color: #c5c8c1;
      font-size: 0.8rem;
      padding: 9px 12px;
    }

    .samit-roast {
      background: #f0efe8;
      border: none;
      border-radius: 22px;
      color: #121416;
      margin-top: 14px;
      padding: 22px;
      text-align: left;
    }

    .samit-roast h3 {
      color: #e15f49;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .samit-roast p {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }

    .roast-meta {
      color: #797b76;
      font-size: 0.72rem;
      font-weight: 500 !important;
      letter-spacing: 0 !important;
      margin-top: 14px;
    }

    .roast-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .action-btn {
      background: transparent;
      border: 1px solid #c9c8c0;
      border-radius: 999px;
      color: #292b2c;
      cursor: pointer;
      flex: 1;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .share-status {
      color: #e15f49;
      font-size: 0.8rem;
      min-height: 1.1em;
      margin-top: 8px;
    }

    .outfit-card {
      background: transparent;
      border: 1px solid #2b2e33;
      border-radius: 22px;
      margin-top: 14px;
      padding: 18px;
      text-align: left;
    }

    .outfit-card h3 {
      color: #bfc2bc;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      margin-bottom: 12px;
      text-align: center;
      text-transform: uppercase;
    }

    .outfit-options {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .outfit-option {
      background: #17191d;
      border: 1px solid #2b2e33;
      border-radius: 14px;
      padding: 11px;
    }

    .outfit-label {
      color: #8f938e;
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .outfit-option p {
      color: #d2d4ce;
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .food-card {
      background: #17191d;
      border: 1px solid #2b2e33;
      border-radius: 22px;
      margin-top: 14px;
      padding: 18px;
      text-align: left;
    }

    .food-card h3 {
      color: #bfc2bc;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      margin-bottom: 12px;
      text-align: center;
      text-transform: uppercase;
    }

    .food-options {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .food-option {
      background: #23262b;
      border-radius: 14px;
      color: #d2d4ce;
      padding: 11px;
    }

    .food-option strong {
      color: #f06a4e;
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .loading, .error {
      padding: 40px;
      font-size: 1.2rem;
    }

    .error {
      color: #f06a4e;
    }

    .btn {
      background: #f06a4e;
      border: none;
      box-shadow: 0 10px 25px rgba(240, 106, 78, 0.2);
      padding: 15px 30px;
      border-radius: 30px;
      color: #150f0c;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .emoji {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    @media (max-width: 480px) {
      body {
        min-height: 100svh;
        justify-content: flex-start;
        overflow-x: hidden;
        padding: 12px 14px calc(78px + env(safe-area-inset-bottom));
      }

      #content {
        padding-bottom: 56px;
        width: 100%;
      }

      .eyebrow {
        font-size: 0.7rem;
        margin-bottom: 4px;
      }

      h1 {
        font-size: 2.1rem;
        margin-bottom: 4px;
      }

      .subtitle {
        font-size: 0.9rem;
        margin-bottom: 12px;
      }

      .location-search {
        gap: 6px;
        margin-bottom: 2px;
      }

      .location-input {
        font-size: 0.85rem;
        padding: 10px 13px;
      }

      .search-btn {
        font-size: 0.75rem;
        padding: 0 13px;
      }

      .use-location {
        font-size: 0.72rem;
        padding: 3px 8px;
      }

      .weather-card {
        padding: 14px 12px;
        margin-bottom: 10px;
      }

      .location {
        font-size: 1.1rem;
        margin-bottom: 4px;
      }

      .emoji {
        font-size: 2.2rem;
        margin-bottom: 4px;
      }

      .temperature {
        font-size: 2.6rem;
        margin: 8px 0;
      }

      .condition {
        font-size: 1.15rem;
        margin-bottom: 4px;
      }

      .details {
        gap: 6px;
        margin-top: 8px;
      }

      .detail-item {
        padding: 7px 8px;
        font-size: 0.78rem;
      }

      .samit-roast {
        padding: 12px;
        margin-top: 10px;
      }

      .outfit-card {
        margin-top: 10px;
        padding: 12px;
      }

      .outfit-card h3 {
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
      }

      .outfit-options {
        gap: 6px;
      }

      .outfit-option {
        padding: 7px;
      }

      .outfit-option p {
        font-size: 0.75rem;
      }

      .food-card {
        margin-top: 8px;
        padding: 12px;
      }

      .food-card h3 {
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
      }

      .food-options {
        gap: 6px;
      }

      .food-option {
        font-size: 0.75rem;
        padding: 7px;
      }

      .food-option strong {
        font-size: 0.62rem;
        margin-bottom: 3px;
      }

      .samit-roast h3 {
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        margin-bottom: 10px;
      }

      .samit-roast p {
        font-size: 0.98rem;
        line-height: 1.3;
      }

      .roast-actions {
        gap: 8px;
        margin-top: 8px;
      }

      .action-btn {
        font-size: 0.78rem;
        padding: 8px 6px;
      }

      .roast-meta {
        font-size: 0.7rem;
        margin-top: 6px;
      }

      .share-status {
        font-size: 0.7rem;
        min-height: 0;
        margin-top: 4px;
      }

      .btn {
        bottom: calc(8px + env(safe-area-inset-bottom));
        font-size: 0.95rem;
        left: 14px;
        margin-top: 0;
        padding: 11px 20px;
        position: fixed;
        right: 14px;
        width: auto;
        z-index: 10;
        box-shadow: 0 5px 18px rgba(0, 0, 0, 0.35);
      }
    }

    @media (max-width: 480px) and (max-height: 850px) {
      body {
        padding-top: 8px;
      }

      .subtitle {
        margin-bottom: 9px;
      }

      .weather-card {
        padding: 12px;
      }

      .temperature {
        margin: 6px 0 8px;
      }

      .outfit-card,
      .samit-roast {
        margin-top: 8px;
      }
    }
  </style>
</head>

  <div class="container">
    <p class="eyebrow">Weather-powered roasting</p>
    <h1>Samit Roast</h1>
    <p class="subtitle">Real weather. Unnecessarily personal commentary.</p>

    <form class="location-search" onsubmit="searchLocation(event)">
      <label class="sr-only" for="location-input">Enter a location</label>
      <input id="location-input" class="location-input" type="search" placeholder="Enter a city or place" autocomplete="off">
      <button class="search-btn" type="submit">Search</button>
    </form>
    <button class="use-location" type="button" onclick="getLocation()">⌖ Use my location</button>

    <div id="content">
      <div class="loading">
        <div class="emoji">🌤️</div>
        <p>Finding your location...</p>
      </div>
    </div>

  <script>
    const SAMIT_ROASTS = {
      hot: [
        "It's hotter than Samit trying to explain why he's right.",
        "This heat? Samit levels of unbearable.",
        "Hotter than Samit's take on literally anything.",
        "Samit walked outside and said 'damn, even I'm not this fire'.",
        "It's so hot Samit's brain actually started working.",
      ],
      cold: [
        "Colder than Samit's dead eyes when someone asks him a question.",
        "This cold? Samit's personality levels of frigid.",
        "Colder than Samit's response to 'we need to talk'.",
        "Samit saw this temperature and finally found somewhere he fits in.",
        "It's so cold even Samit's excuses are freezing up.",
      ],
      rain: [
        "Raining harder than Samit cries during team standup.",
        "This rain? Samit's confidence levels of pouring.",
        "Samit looked outside and said 'finally, weather that matches my energy'.",
        "It's raining so hard Samit thought it was his ideas getting shot down.",
        "Even the sky is dumping on Samit today.",
      ],
      sunny: [
        "Sunnier than Samit's disposition when he's actually right (rare).",
        "This sun? Samit's ego levels of bright.",
        "Samit tried to photosynthesize and failed.",
        "Bright enough to expose all of Samit's bad takes.",
        "Samit squinted at the sun and the sun looked away first.",
      ],
      cloudy: [
        "Cloudier than Samit's explanation of his weekend plans.",
        "These clouds? Samit's future levels of overcast.",
        "Samit looked at the clouds and finally understood something.",
        "Cloudy enough to hide Samit from his responsibilities.",
        "The clouds are confused but still clearer than Samit's priorities.",
      ],
      windy: [
        "Windier than Samit's excuses when he misses a deadline.",
        "This wind? Samit's hot air levels of blowing.",
        "Samit's hair has never been more alive.",
        "The wind is carrying Samit's empty promises away.",
        "Windy enough to blow Samit's cover.",
      ],
      snow: [
        "Snowing harder than Samit avoids responsibility.",
        "This snow? Samit's social skills levels of frozen.",
        "Samit tried to catch a snowflake and it melted from his warmth.",
        "Finally, weather as cold as Samit's gaming skills.",
        "It's snowing so much Samit thinks he's in a team building exercise.",
      ],
      default: [
        "The weather is as confusing as Samit's life choices.",
        "Samit looked at the forecast and said 'mood'.",
        "This weather? Samit levels of unpredictable.",
        "Samit would like to apologize for this weather.",
        "Whatever this is, Samit definitely caused it.",
      ],
    };

    let roastContext = null;
    let roastCount = 0;
    let currentRoast = '';

    function getSamitRoast(condition, temp) {
      const cond = condition.toLowerCase();
      let roasts = SAMIT_ROASTS.default;

      if (cond.includes('rain')) roasts = SAMIT_ROASTS.rain;
      else if (cond.includes('snow')) roasts = SAMIT_ROASTS.snow;
      else if (cond.includes('cloud')) roasts = SAMIT_ROASTS.cloudy;
      else if (cond.includes('sun') || cond.includes('clear')) roasts = SAMIT_ROASTS.sunny;
      else if (cond.includes('wind')) roasts = SAMIT_ROASTS.windy;
      else if (temp >= 30) roasts = SAMIT_ROASTS.hot;
      else if (temp <= 5) roasts = SAMIT_ROASTS.cold;

      return roasts[Math.floor(Math.random() * roasts.length)];
    }

    function newRoast() {
      if (!roastContext) return;

      currentRoast = getSamitRoast(roastContext.condition, roastContext.temp);
      roastCount += 1;
      document.getElementById('roast-text').textContent = currentRoast;
      document.getElementById('roast-count').textContent = `Roast #${roastCount}`;
      document.getElementById('share-status').textContent = '';
      posthog.capture('new_roast', { roast_number: roastCount });
    }

    async function shareRoast() {
      if (!currentRoast) return;

      const shareText = `Samit Roast: ${currentRoast}`;
      try {
        if (navigator.share) {
          await navigator.share({ title: 'Samit Roast', text: shareText });
        } else {
          await navigator.clipboard.writeText(shareText);
          document.getElementById('share-status').textContent = 'Copied to clipboard';
        }
        posthog.capture('roast_shared');
      } catch (err) {
        if (err.name !== 'AbortError') {
          document.getElementById('share-status').textContent = 'Could not share that roast';
        }
      }
    }

    function getWeatherEmoji(condition) {
      const cond = condition.toLowerCase();
      if (cond.includes('thunder')) return '⛈️';
      if (cond.includes('rain')) return '🌧️';
      if (cond.includes('snow')) return '❄️';
      if (cond.includes('cloud')) return '☁️';
      if (cond.includes('sun') || cond.includes('clear')) return '☀️';
      if (cond.includes('wind')) return '💨';
      if (cond.includes('fog')) return '🌫️';
      return '🌤️';
    }

    function getOutfitAdvice(temp, condition) {
      const cond = condition.toLowerCase();

      if (cond.includes('snow')) {
        return {
          human: 'Warm coat, gloves, boots, and layers.',
          samit: 'Swim trunks, flip-flops, and an ice cube for emotional support.',
        };
      }

      if (cond.includes('rain') || cond.includes('drizzle') || cond.includes('showers')) {
        return {
          human: 'Rain jacket, water-resistant shoes, and an umbrella.',
          samit: 'A white shirt, suede shoes, and a paper hat.',
        };
      }

      if (temp <= 50) {
        return {
          human: 'A warm jacket, long pants, and closed-toe shoes.',
          samit: 'Tank top, shorts, and flip-flops. Confidence is insulation.',
        };
      }

      if (temp >= 80) {
        return {
          human: 'Light clothes, breathable shoes, sunglasses, and water.',
          samit: 'A winter coat, wool scarf, and a personal space heater.',
        };
      }

      if (cond.includes('wind')) {
        return {
          human: 'A light windbreaker and secure shoes.',
          samit: 'An inflatable costume and a handful of loose receipts.',
        };
      }

      return {
        human: 'A light layer and comfortable shoes should do nicely.',
        samit: 'A tuxedo with hiking boots. No explanation provided.',
      };
    }

    function getFoodAdvice(temp, condition) {
      const cond = condition.toLowerCase();

      if (cond.includes('rain') || cond.includes('drizzle') || cond.includes('showers')) {
        return {
          human: 'Ramen, soup, or a warm bowl of something comforting.',
          samit: 'A dry salad eaten under an umbrella while judging the clouds.',
        };
      }

      if (temp >= 80) {
        return {
          human: 'Tacos, fresh fruit, or anything cold and refreshing.',
          samit: 'A three-course fondue dinner in a wool sweater.',
        };
      }

      if (temp <= 50 || cond.includes('snow')) {
        return {
          human: 'Chili, grilled cheese, or a hot bowl of ramen.',
          samit: 'A melting popsicle served in a snowbank.',
        };
      }

      if (cond.includes('wind')) {
        return {
          human: 'Something handheld that will not blow away—pizza works.',
          samit: 'A bowl of spaghetti eaten with a leaf blower nearby.',
        };
      }

      return {
        human: 'Whatever sounds good—this is excellent patio weather.',
        samit: 'Plain ice cubes with a side of room-temperature ketchup.',
      };
    }

    async function fetchWeather(lat, lon) {
      const response = await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto&temperature_unit=fahrenheit&windspeed_unit=mph`
      );
      if (!response.ok) throw new Error('Weather request failed');
      return response.json();
    }

    async function reverseGeocode(lat, lon) {
      const response = await fetch(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`
      );
      if (!response.ok) throw new Error('Location lookup failed');
      return response.json();
    }

    async function searchGeocoding(query) {
      const response = await fetch(
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=en&format=json`
      );
      if (!response.ok) throw new Error('Search request failed');
      const data = await response.json();
      if (!data.results || data.results.length === 0) {
        throw new Error('No location found');
      }
      const normalizedQuery = query.toLowerCase();
      const exactMatches = data.results.filter((result) =>
        result.name.toLowerCase() === normalizedQuery
      );
      const candidates = exactMatches.length > 0 ? exactMatches : data.results;
      return candidates.sort((a, b) => (b.population || 0) - (a.population || 0))[0];
    }

    function getLocationName(location) {
      return location.locality || location.city || location.town || location.name || 'Your Location';
    }

    function showLoading(message) {
      document.getElementById('content').innerHTML = `
        <div class="loading">
          <div class="emoji">📍</div>
          <p>${message}</p>
        </div>
      `;
    }

    async function searchLocation(event) {
      event.preventDefault();
      const input = document.getElementById('location-input');
      const query = input.value.trim();
      if (!query) {
        input.focus();
        return;
      }

      showLoading(`Finding weather for ${query}...`);

      try {
        const place = await searchGeocoding(query);
        const weatherData = await fetchWeather(place.latitude, place.longitude);
        renderWeather(weatherData, place);
        posthog.capture('location_searched', { query, city: place.name });
      } catch (err) {
        posthog.capture('location_search_error', { query, error: err.message });
        showError(`Could not find “${query}”. Try a city, neighborhood, or ZIP code.`);
      }
    }

    function renderWeather(data, location) {
      const current = data.current_weather;
      const temp = Math.round(current.temperature);
      const condition = current.weathercode;
      const windSpeed = current.windspeed;

      // Track successful weather load
      posthog.capture('weather_loaded', {
        temperature: temp,
        condition: condition,
        city: getLocationName(location)
      });

      // Map weather codes to descriptions
      const weatherCodes = {
        0: 'Clear sky',
        '1-3': 'Partly cloudy',
        '45,48': 'Foggy',
        '51-55': 'Drizzle',
        '61-67': 'Rain',
        '71-77': 'Snow',
        '80-82': 'Showers',
        '95-99': 'Thunderstorm',
      };

      let conditionText = 'Clear';
      if (condition >= 95) conditionText = 'Thunderstorm';
      else if (condition >= 80) conditionText = 'Showers';
      else if (condition >= 71) conditionText = 'Snow';
      else if (condition >= 61) conditionText = 'Rain';
      else if (condition >= 51) conditionText = 'Drizzle';
      else if (condition >= 45) conditionText = 'Foggy';
      else if (condition >= 1) conditionText = 'Partly cloudy';

      const city = getLocationName(location);
      const roast = getSamitRoast(conditionText, temp);
      const emoji = getWeatherEmoji(conditionText);
      const outfit = getOutfitAdvice(temp, conditionText);
      const food = getFoodAdvice(temp, conditionText);

      roastContext = { condition: conditionText, temp };
      currentRoast = roast;
      roastCount = 1;

      document.getElementById('content').innerHTML = `
        <div class="weather-card">
          <div class="location">
            <span>📍</span>
            <span>${city}</span>
          </div>
          <div class="emoji">${emoji}</div>
          <div class="temperature">${temp}°F</div>
          <div class="condition">${conditionText}</div>
          <div class="details">
            <div class="detail-item">💨 ${windSpeed} km/h</div>
            <div class="detail-item">🧥 ${temp < 10 ? 'Bundle up' : temp > 25 ? 'Stay cool' : 'Just right'}</div>
          </div>
        </div>
        <div class="outfit-card">
          <h3>The Dress Code</h3>
          <div class="outfit-options">
            <div class="outfit-option">
              <span class="outfit-label">Normal human</span>
              <p>${outfit.human}</p>
            </div>
            <div class="outfit-option">
              <span class="outfit-label">Samit's choice</span>
              <p>${outfit.samit}</p>
            </div>
          </div>
        </div>
        <div class="food-card">
          <h3>What to Eat</h3>
          <div class="food-options">
            <div class="food-option"><strong>Normal human</strong><br>${food.human}</div>
            <div class="food-option"><strong>Samit</strong><br>${food.samit}</div>
          </div>
        </div>
        <div class="samit-roast">
          <h3>Samit's Take</h3>
          <p id="roast-text">${roast}</p>
          <p class="roast-meta" id="roast-count">Roast #1 · Based on the weather</p>
          <div class="roast-actions">
            <button class="action-btn" onclick="newRoast()">🔥 Another Roast</button>
            <button class="action-btn" onclick="shareRoast()">↗ Share It</button>
          </div>
          <p class="share-status" id="share-status" aria-live="polite"></p>
        </div>
        <button class="btn" onclick="getLocation()">Refresh Weather</button>
      `;
    }

    function showError(message) {
      document.getElementById('content').innerHTML = `
        <div class="error">
          <div class="emoji">😬</div>
          <p>${message}</p>
          <button class="btn" onclick="getLocation()">Try Again</button>
        </div>
      `;
    }

    function getLocation() {
      if (!navigator.geolocation) {
        showError('Your browser is older than Samit\'s outdated takes. Get a new one.');
        return;
      }

      showLoading('Finding you (unlike Samit finding direction in life)...');

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          try {
            const { latitude, longitude } = position.coords;
            const [weatherData, location] = await Promise.all([
              fetchWeather(latitude, longitude),
              reverseGeocode(latitude, longitude),
            ]);
            renderWeather(weatherData, location);
          } catch (err) {
            posthog.capture('weather_fetch_error', { error: err.message });
            showError('Could not fetch weather. Even Samit has better luck than this.');
          }
        },
        (error) => {
          // Track geolocation errors
          posthog.capture('geolocation_error', {
            code: error.code,
            message: error.message
          });

          switch (error.code) {
            case error.PERMISSION_DENIED:
              showError('Enable location. Don\'t be a Samit.');
              break;
            case error.POSITION_UNAVAILABLE:
              showError('Location unavailable. Samit levels of unhelpful.');
              break;
            case error.TIMEOUT:
              showError('Location took too long. Try again when Safari has found itself.');
              break;
            default:
              showError('Something went wrong. Classic Samit move.');
          }
        },
        {
          enableHighAccuracy: true,
          maximumAge: 300000,
          timeout: 10000
        }
      );
    }

    // Track page view
    posthog.capture('page_view');

    // Track refresh button clicks
    document.addEventListener('click', function(e) {
      if (e.target.classList.contains('btn')) {
        posthog.capture('refresh_clicked');
      }
    });

    // Start the app
    getLocation();
  </script>
</body>
</html>
